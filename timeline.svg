,Helvetica,Arial,sans-serif" font-size="13" fill="#818cf8">Software Craftsperson</text><text x="451" y="216" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8aa0bf">Collaboration tools, timesheets</text><rect x="654" y="130" width="504" height="14" rx="7" fill="#fbbf24" opacity=".9"/><rect x="654" y="130" width="504" height="14" rx="7" fill="url(#shine)"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></rect><circle cx="1148" cy="137" r="5" fill="#fff"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><line x1="660" y1="144" x2="660" y2="252" stroke="#fbbf24" stroke-opacity=".5"/><text x="660" y="270" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">NymCard</text><text x="660" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#fbbf24">Full Stack Engineer (Backend Focus)</text><text x="660" y="308" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8aa0bf">Fortress, BNPL, ID verification, bank APIs</text><text x="115" y="118" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#566a89">2021</text><text x="294" y="118" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#566a89">2022</text><text x="473" y="118" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#566a89">2023</text><text x="652" y="118" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#566a89">2024</text><text x="831" y="118" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#566a89">2025</text><text x="1011" y="118" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#566a89">2026</text></svg>